name: Build and test wheels on multiple platforms

on:
  release:
    types: [published]
  push:
  pull_request:

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        run: pipx run build --sdist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: ${{ matrix.os }} ${{ matrix.CIBW_ARCHS }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            CIBW_ENVIRONMENT: ''
            CIBW_ARCHS: "x86_64"
            CIBW_PLATFORM: "auto"
          - os: ubuntu-latest
            CIBW_ENVIRONMENT: ''
            CIBW_ARCHS: "wasm32"
            CIBW_PLATFORM: "pyodide"
          - os: ubuntu-24.04-arm
            CIBW_ENVIRONMENT: ''
            CIBW_ARCHS: "aarch64"
            CIBW_PLATFORM: "auto"
          - os: windows-latest
            CIBW_ENVIRONMENT: ''
            CIBW_ARCHS: "AMD64"
            CIBW_PLATFORM: "auto"
          - os: windows-11-arm
            CIBW_ENVIRONMENT: ''
            CIBW_ARCHS: "ARM64"
            CIBW_PLATFORM: "auto"
          - os: macos-15-intel
            CIBW_ENVIRONMENT: >
              MACOSX_DEPLOYMENT_TARGET='13.0'
            CIBW_ARCHS: "x86_64"
            CIBW_PLATFORM: "auto"
          - os: macos-latest # Apple Silicon
            CIBW_ENVIRONMENT: >
              MACOSX_DEPLOYMENT_TARGET='13.0'
            CIBW_ARCHS: "arm64"
            CIBW_PLATFORM: "auto"
    env:
      CIBW_ENVIRONMENT: ${{ matrix.CIBW_ENVIRONMENT }}
      # Windows on ARM has native CPython builds from 3.11 only
      CIBW_SKIP: "*-win32 *i686 cp310-win_arm64"
      CIBW_ARCHS: ${{ matrix.CIBW_ARCHS }}
      CIBW_PLATFORM: ${{ matrix.CIBW_PLATFORM }}
      CIBW_ENVIRONMENT_LINUX: PATH=/usr/local/bin:/usr/lib/ccache:$PATH CCACHE_DIR=/host${{ github.workspace }}/.ccache CCACHE_CONFIGPATH=/host/home/runner/.config/ccache/ccache.conf
      # see https://github.com/matplotlib/matplotlib/pull/28687/files#diff-504e739c530d50b780e9a09ae8fd0c3ea8258ea7553be06afb06f03f95b1ee0aR103
      CIBW_CONFIG_SETTINGS_WINDOWS: >-
        setup-args="--vsenv"
        setup-args="-Db_vscrt=mt"
        setup-args="-Dcpp_link_args=['ucrt.lib','vcruntime.lib','/nodefaultlib:libucrt.lib','/nodefaultlib:libvcruntime.lib']"
    steps:
      - uses: actions/checkout@v7
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.CIBW_ARCHS }}
          max-size: "5G"
      # Each wheel runs tests/wheel/test_wheel.py in its own environment (see
      # [tool.cibuildwheel] in pyproject.toml): import cefast, load a small inline CEF file from
      # bytes, gzip bytes and a path. The CSA corpus is never needed.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.CIBW_ARCHS }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    # upload to PyPI only on github releases
    environment:
      name: pypi
      url: https://pypi.org/p/cefast
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published' && github.repository_owner == 'SciQLop'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
