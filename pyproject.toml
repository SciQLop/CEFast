[build-system]
requires = ["meson-python>=0.15"]
build-backend = "mesonpy"

[project]
name = "cefast"
dynamic = ["version"]
description = "Fast reader for ESA's Cluster Exchange Format (CEF 2.0)"
authors = [{ name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "COPYING" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy"]

[project.urls]
homepage = "https://github.com/SciQLop/CEFast"
repository = "https://github.com/SciQLop/CEFast"
documentation = "https://cefast.readthedocs.io"

[tool.meson-python.args]
setup = [
    "-Dwith_tests=false",
    "-Ddefault_library=static",
    "--force-fallback-for=pybind11,zlib",
]
# Headers and pkg-config files of the vendored subprojects belong in an install prefix, not in a
# wheel: only the extension module and the python sources are shipped.
install = ["--tags=runtime,python-runtime"]

[tool.cibuildwheel]
build-frontend = "default"
test-requires = ["numpy"]
test-command = "python {project}/tests/wheel/test_wheel.py"

[tool.cibuildwheel.windows]
before-build = "python -m pip install delvewheel"
repair-wheel-command = "python -m delvewheel repair -v -w {dest_dir} {wheel}"
