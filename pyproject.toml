[build-system]
requires = ["meson-python>=0.15", "pybind11>=2.11"]
build-backend = "mesonpy"

[project]
name = "cefast"
dynamic = ["version"]
description = "Fast reader for ESA's Cluster Exchange Format (CEF 2.0)"
readme = "docs/superpowers/specs/2026-11-05-cefast-design.md"
requires-python = ">=3.10"
license = { file = "COPYING" }
dependencies = ["numpy"]

[tool.meson-python.args]
setup = ["-Dwith_tests=false"]
compile = []
install = []
